# Render.com Blueprint - Otomatik Deployment
# Bu dosyayı repo root'una koyun

services:
  # Backend API + Socket.io Service
  - type: web
    name: takason-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # -----------------------------------------------
      # Supabase Veritabanı (Manuel olarak ekle)
      # -----------------------------------------------
      - key: DATABASE_URL
        sync: false   # Supabase → Settings → Database → Connection Pooling (port 6543)
      - key: DIRECT_URL
        sync: false   # Supabase → Settings → Database → Direct Connection (port 5432)

      # -----------------------------------------------
      # Supabase Storage - Medya dosyaları için (Manuel)
      # -----------------------------------------------
      - key: SUPABASE_URL
        sync: false   # Supabase → Settings → API → Project URL
      - key: SUPABASE_SERVICE_KEY
        sync: false   # Supabase → Settings → API → service_role (gizli tut!)

      # -----------------------------------------------
      # JWT (Render otomatik üretir)
      # -----------------------------------------------
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # -----------------------------------------------
      # CORS - Frontend URL'leri buraya ekle
      # yourdomain.com kısmını kendi domaininizle değiştir
      # -----------------------------------------------
      - key: ALLOWED_ORIGINS
        value: https://takason.com.tr,https://www.takason.com.tr

      # -----------------------------------------------
      # Rate Limiting
      # -----------------------------------------------
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100

      # -----------------------------------------------
      # Medya Yükleme
      # -----------------------------------------------
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: ALLOWED_FILE_TYPES
        value: image/jpeg,image/png,image/webp,image/gif

      # -----------------------------------------------
      # Cloudinary - Resim yükleme (Manuel olarak ekle)
      # -----------------------------------------------
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # Cloudinary Dashboard → Account Details
      - key: CLOUDINARY_API_KEY
        sync: false   # Cloudinary Dashboard → Account Details
      - key: CLOUDINARY_API_SECRET
        sync: false   # Cloudinary Dashboard → Account Details

      # -----------------------------------------------
      # Supabase Anon Key (Opsiyonel)
      # -----------------------------------------------
      - key: SUPABASE_ANON_KEY
        sync: false   # Supabase → Settings → API → anon public key

    healthCheckPath: /api/health
