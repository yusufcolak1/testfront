version: "3.8"

services:
  # ============================================
  # NGINX REVERSE PROXY
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: takason-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - takason-net

  # ============================================
  # BACKEND (Node.js + Prisma + SQLite)
  # ============================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: takason-backend
    restart: always
    env_file:
      - ./server/.env.docker
    volumes:
      - sqlite-data:/app/data
      - uploads-data:/app/uploads
    networks:
      - takason-net
    expose:
      - "5000"

  # ============================================
  # FRONTEND (React Vite → Nginx Static)
  # ============================================
  frontend:
    build:
      context: ./react-app
      dockerfile: Dockerfile
    container_name: takason-frontend
    restart: always
    networks:
      - takason-net
    expose:
      - "80"

networks:
  takason-net:
    driver: bridge

volumes:
  sqlite-data:
    driver: local
  uploads-data:
    driver: local
